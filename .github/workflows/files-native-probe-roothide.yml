name: Files Native Probe RootHide
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: files-dualpane
    env:
      THEOS: ${{ github.workspace }}/.files-probe-theos
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static safety checks
        run: |
          python3 tests/check_dualpane.py
          python3 tests/check_actions.py
          python3 tests/check_060.py
          python3 tests/check_070.py
          python3 tests/check_074.py
          python3 tests/check_076.py
          python3 tests/check_077.py
          python3 tests/check_078.py
          python3 tests/check_079.py
      - name: Execute native current location fixture
        run: |
          python3 tests/location_host.py "$RUNNER_TEMP/location-host.m"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation "$RUNNER_TEMP/location-host.m" -o "$RUNNER_TEMP/location-host"
          "$RUNNER_TEMP/location-host"
      - name: Prove five regressions against pinned 0.7.8 production
        run: |
          git fetch --depth=1 origin 8a803fd6df47febded148e8892a1556071a1a295
          git show 8a803fd6df47febded148e8892a1556071a1a295:files-dualpane/NativeCompact.inc > "$RUNNER_TEMP/native-078.inc"
          python3 -c 'import hashlib,os,pathlib; assert hashlib.sha256(pathlib.Path(os.environ["RUNNER_TEMP"],"native-078.inc").read_bytes()).hexdigest()=="3dafbbeb248fbfbd760bf62ee262a8afbedf02c6d03a0f468ccd4f472c28b2f0"'
          python3 tests/style_host.py "$RUNNER_TEMP/old-host.m" --native-source "$RUNNER_TEMP/native-078.inc"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation -framework CoreGraphics "$RUNNER_TEMP/old-host.m" -o "$RUNNER_TEMP/old-host"
          for case in width max sibling status delayedready; do
            set +e
            FILES_STYLE_CASE="$case" "$RUNNER_TEMP/old-host" > "$RUNNER_TEMP/old-$case.log" 2>&1
            result=$?
            set -e
            test "$result" -eq 134
            python3 -c 'import os,pathlib,sys; name=sys.argv[1]; expected={"width":"WidthLimitCase","max":"AssertTextLimits","sibling":"SiblingCase","status":"StatusCase","delayedready":"ReadyCase"}[name]; text=pathlib.Path(os.environ["RUNNER_TEMP"],"old-"+name+".log").read_text(); assert "Assertion failed:" in text and "function "+expected+"," in text; print("PASS pinned 0.7.8 RED:",name,expected)' "$case"
          done
      - name: Execute production style synchronous reentry and restore policy
        run: |
          python3 tests/style_host.py "$RUNNER_TEMP/ui-host.m"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation -framework CoreGraphics "$RUNNER_TEMP/ui-host.m" -o "$RUNNER_TEMP/ui-host"
          "$RUNNER_TEMP/ui-host"
          python3 tests/style_host.py "$RUNNER_TEMP/style-mutant.m" --mutate-margin
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation -framework CoreGraphics "$RUNNER_TEMP/style-mutant.m" -o "$RUNNER_TEMP/style-mutant"
          if "$RUNNER_TEMP/style-mutant" > "$RUNNER_TEMP/mutant.log" 2>&1; then echo 'FAIL: margin regression escaped fixture'; exit 1; else echo 'PASS: deliberate zero-margin mutant rejected'; fi
          python3 tests/style_host.py "$RUNNER_TEMP/native-mutant.m" --mutate-native-size
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation -framework CoreGraphics "$RUNNER_TEMP/native-mutant.m" -o "$RUNNER_TEMP/native-mutant"
          if "$RUNNER_TEMP/native-mutant" > "$RUNNER_TEMP/native-mutant.log" 2>&1; then echo 'FAIL: native sizing regression escaped fixture'; exit 1; else echo 'PASS: deliberate native-size mutant rejected'; fi
      - name: Reject document square-preview regression
        run: |
          python3 tests/style_host.py "$RUNNER_TEMP/document-mutant.m" --mutate-document-square
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation -framework CoreGraphics "$RUNNER_TEMP/document-mutant.m" -o "$RUNNER_TEMP/document-mutant"
          if "$RUNNER_TEMP/document-mutant" > "$RUNNER_TEMP/document-mutant.log" 2>&1; then echo 'FAIL: square document preview escaped fixture'; exit 1; else echo 'PASS: deliberate square document preview mutant rejected'; fi
      - name: Reject native text trailing reservation regression
        run: |
          python3 tests/style_host.py "$RUNNER_TEMP/trailing-mutant.m" --mutate-native-trailing
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation -framework CoreGraphics "$RUNNER_TEMP/trailing-mutant.m" -o "$RUNNER_TEMP/trailing-mutant"
          if "$RUNNER_TEMP/trailing-mutant" > "$RUNNER_TEMP/trailing-mutant.log" 2>&1; then echo 'FAIL: native trailing reservation escaped fixture'; exit 1; else echo 'PASS: native trailing reservation mutant rejected'; fi
      - name: Execute production Swift generic bridge host model
        run: |
          python3 tests/swift_host.py "$RUNNER_TEMP/swift-host.swift"
          swiftc "$RUNNER_TEMP/swift-host.swift" -o "$RUNNER_TEMP/swift-host"
          "$RUNNER_TEMP/swift-host"
      - name: Execute production file core and selection fixtures
        run: |
          python3 tests/core_host.py "$RUNNER_TEMP/core-host.m"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation "$RUNNER_TEMP/core-host.m" -o "$RUNNER_TEMP/core-host"
          "$RUNNER_TEMP/core-host"
      - name: Execute coordinated preview fixture and scope lifecycle
        run: |
          python3 tests/preview_host.py "$RUNNER_TEMP/preview-host.m"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation "$RUNNER_TEMP/preview-host.m" -o "$RUNNER_TEMP/preview-host"
          "$RUNNER_TEMP/preview-host"
      - name: Execute production transient state wrappers on host
        run: |
          python3 tests/state_host.py "$RUNNER_TEMP/state-host.m"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -framework Foundation "$RUNNER_TEMP/state-host.m" -o "$RUNNER_TEMP/state-host"
          "$RUNNER_TEMP/state-host"
      - name: Prepare RootHide Theos
        run: |
          brew install make ldid dpkg
          git clone --depth 1 --recursive --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          xcodebuild -version
          git -C "$THEOS" rev-parse HEAD
          git -C "$THEOS" submodule status --recursive
      - name: Build native experiment arm64 and arm64e
        run: |
          set -o pipefail
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee "$RUNNER_TEMP/files-probe-build.log"
      - name: Verify package
        run: |
          shopt -s nullglob
          packages=(packages/*.deb)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = dev.filesdualpane.nativeprobe
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
          test "$(dpkg-deb -f "$deb" Version)" = 0.7.9
          dpkg-deb -x "$deb" "$RUNNER_TEMP/files-package"
          binary=$(python3 -c 'import os,pathlib; print(next(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("files-package").rglob("FilesNativeProbe.dylib")))')
          test -n "$binary"
          lipo -info "$binary"
          lipo "$binary" -verify_arch arm64 arm64e
          python3 tests/verify_signed.py "$binary"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          shasum -a 256 packages/*.deb > packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: files-native-probe-${{ github.sha }}
          path: |
            files-dualpane/packages/*.deb
            files-dualpane/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: files-native-probe-log-${{ github.run_id }}
          path: ${{ runner.temp }}/files-probe-build.log
          if-no-files-found: ignore
          retention-days: 7
