name: Toolbar targeted Apple checks
on:
  push:
    branches: [wu-toolbar-20261102]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile all Objective-C sources for iOS arm64
        working-directory: wechat-unified
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p "$RUNNER_TEMP/wu-ios-objects"
          for source in Sources/*.m; do
            echo "Compiling $source"
            xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.6 -fobjc-arc -fobjc-arc-exceptions -fblocks -c -Wall -Wextra -Werror -Wno-unused-parameter -Wno-nullability-completeness "$source" -o "$RUNNER_TEMP/wu-ios-objects/$(basename "${source%.m}").o"
          done
          xcrun --sdk iphoneos clang -std=c11 -O2 -fPIC -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.6 -Wall -Wextra -Werror -I Sources -c Sources/WUNativeBoot.c -o "$RUNNER_TEMP/wu-ios-objects/WUNativeBoot.o"
      - name: Run Foundation account layout logic tests
        working-directory: wechat-unified
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -fobjc-arc -fobjc-arc-exceptions -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -I Sources tests/group_logic.m Sources/GroupLogic.m Sources/HomeLogic.m -framework Foundation -o "$RUNNER_TEMP/wu-group-test"
          "$RUNNER_TEMP/wu-group-test"
          python3 tests/test_chat_layout.py
