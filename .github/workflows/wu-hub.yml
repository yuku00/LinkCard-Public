name: Plugin hub targeted iOS build
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: iOS arm64 compile
        working-directory: wechat-unified
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.6 -fobjc-arc -fobjc-arc-exceptions -fblocks -fsyntax-only -Wall -Wextra -Werror -Wno-unused-parameter -Wno-nullability-completeness Sources/*.m
      - name: Plugin hub model tests
        working-directory: wechat-unified
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fobjc-arc-exceptions -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -I Sources tests/plugin_hub_logic.m Sources/PluginHubLogic.m -framework Foundation -o /tmp/wu-hub-tests
          /tmp/wu-hub-tests
