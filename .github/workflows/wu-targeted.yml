name: WU session scan focused
on: push
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: iOS arm64 compile
        working-directory: wechat-unified
        run: |
          mkdir -p build/session-ios
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for name in HomeGroups Messages WUStats WUStatsOverview; do
            xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.6 -fobjc-arc -fobjc-arc-exceptions -fblocks -c -Wall -Wextra -Werror -Wno-unused-parameter -Wno-nullability-completeness "Sources/$name.m" -o "build/session-ios/$name.o"
          done
      - name: Foundation statistics tests
        working-directory: wechat-unified
        run: bash tools/test_stats.sh
