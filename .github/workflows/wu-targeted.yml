name: Text bubble targeted compile
on: push
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile iOS arm64 production objects
        working-directory: wechat-unified
        run: |
          mkdir -p build/target
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for name in Surfaces Messages Core ThemeCatalog SurfaceSettings Settings; do
            xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.6 -fobjc-arc -fobjc-arc-exceptions -fblocks -c -Wall -Wextra -Werror -Wno-unused-parameter -Wno-nullability-completeness "Sources/$name.m" -o "build/target/$name.o"
          done
      - name: Bubble contracts
        working-directory: wechat-unified
        run: python3 tests/test_text_bubble_surface.py
