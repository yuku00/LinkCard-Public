name: WU child surface iOS compile
on: push
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile changed iOS surface source
        working-directory: wechat-unified
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.6 -fobjc-arc -fobjc-arc-exceptions -fblocks -c -Wall -Wextra -Werror -Wno-unused-parameter -Wno-nullability-completeness Sources/Surfaces.m -o /tmp/Surfaces.o
      - name: Check refresh wiring
        working-directory: wechat-unified
        run: python3 tests/test_child_surface_refresh.py
