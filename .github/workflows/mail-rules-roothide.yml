name: Mail Rules RootHide
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mail-rules
    env:
      THEOS: ${{ github.workspace }}/.mail-rules-theos
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native release boundaries
        run: |
          python3 tests/check_native.py
          python3 tests/check_trace.py
      - name: Execute opt-in trace host before native fixtures
        run: |
          clang -fno-objc-arc -fblocks -fsanitize=address -Wall -Wextra -Werror -Wno-unused-parameter -Wno-deprecated-declarations -I. -c Trace.m -o "$RUNNER_TEMP/mail-trace.o"
          clang -fno-objc-arc -fblocks -fsanitize=address -Wall -Wextra -Werror -Wno-unused-parameter -Wno-deprecated-declarations -I. -framework Foundation NativeCore.m tests/trace-host.m "$RUNNER_TEMP/mail-trace.o" -o "$RUNNER_TEMP/mail-trace-host"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/mail-trace-host"
      - name: Execute production query and native interaction fixtures
        run: |
          for memory in -fobjc-arc -fno-objc-arc; do
            clang "$memory" -fblocks -fsanitize=address -Wall -Wextra -Werror -Wno-unused-parameter -Wno-deprecated-declarations -I. -framework Foundation NativeCore.m tests/native-host.m "$RUNNER_TEMP/mail-trace.o" -o "$RUNNER_TEMP/mail-native-host"
            ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/mail-native-host"
          done
      - name: Prepare RootHide Theos
        run: |
          brew install make ldid dpkg
          git clone --depth 1 --recursive --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          xcodebuild -version
          git -C "$THEOS" rev-parse HEAD
      - name: Build Mail Rules arm64 and arm64e
        run: |
          set -o pipefail
          rm -f packages/*.deb
          chmod 755 layout/DEBIAN/postrm
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee "$RUNNER_TEMP/mail-rules-build.log"
      - name: Verify package identity and production-only slices
        run: |
          shopt -s nullglob
          packages=(packages/*.deb)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = dev.mailrules.probe
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
          test "$(dpkg-deb -f "$deb" Version)" = 0.5.1
          dpkg-deb -x "$deb" "$RUNNER_TEMP/mail-rules-package"
          binary=$(python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"mail-rules-package"; binaries=list(p.rglob("*.dylib")); assert len(binaries)==1 and binaries[0].name=="MailRules.dylib"; print(binaries[0])')
          lipo "$binary" -verify_arch arm64 arm64e
          python3 -c 'import pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes(); forbidden=[b"applyFilterPredicate:",b"filteredMessageListWithPredicate:",b"MRState",b"dev.mailrules.rules",b"EMCreateMailboxChangeAction",b"EMMessageTransferAction"]; assert not any(x in b for x in forbidden), "Legacy functionality linked"; required=[b"mail051-trace-r1",b"selection.map",b"install.query",b"diagnostic_dry_run",b"query.generated",b"dev.mailrules.native5",b"MR5State",b"_showTransferPickerForNonPredictiveMoveOfMessages:",b"initWithMailbox:account:validAccounts:"]; assert all(x in b for x in required), "Native functionality missing"; print("PASS: native query/organization present; old replay and direct repository actions absent")' "$binary"
          lipo -info "$binary"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          shasum -a 256 packages/*.deb > packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mail-rules-0.5.1-${{ github.sha }}
          path: |
            mail-rules/packages/*.deb
            mail-rules/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-rules-log-${{ github.run_id }}
          path: ${{ runner.temp }}/mail-rules-build.log
          if-no-files-found: ignore
          retention-days: 7
