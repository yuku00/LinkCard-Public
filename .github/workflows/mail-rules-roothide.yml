name: Mail Read-only Probe RootHide
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mail-rules
    env:
      THEOS: ${{ github.workspace }}/.mail-rules-theos
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated read-only source boundary
        run: python3 tests/check_readonly.py
      - name: Execute production graph metadata observer and lifecycle with abort traps
        run: |
          clang -DRO_HOST=1 -fobjc-arc -fblocks -fsanitize=address -Wall -Wextra -Werror -Wno-unused-parameter -Wno-deprecated-declarations -I. -framework Foundation readonly/Session.m readonly/Graph.m readonly/Metadata.m readonly/Observer.m tests/readonly-host.m -o "$RUNNER_TEMP/mail-readonly-host"
          ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/mail-readonly-host"
      - name: Prepare RootHide Theos
        run: |
          brew install make ldid dpkg ripgrep
          git clone --depth 1 --recursive --shallow-submodules https://github.com/roothide/theos.git "$THEOS"
          xcodebuild -version
          git -C "$THEOS" rev-parse HEAD
      - name: Build Mail Rules arm64 and arm64e
        run: |
          set -o pipefail
          rm -f packages/*.deb
          chmod 755 layout/DEBIAN/postrm
          gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee "$RUNNER_TEMP/mail-rules-build.log"
      - name: Verify package identity and production-only slices
        run: |
          shopt -s nullglob
          packages=(packages/*.deb)
          test "${#packages[@]}" -eq 1
          deb="${packages[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = dev.mailrules.probe
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
          test "$(dpkg-deb -f "$deb" Version)" = 0.5.2
          dpkg-deb -x "$deb" "$RUNNER_TEMP/mail-rules-package"
          binary=$(python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"mail-rules-package"; binaries=list(p.rglob("*.dylib")); assert len(binaries)==1 and binaries[0].name=="MailRules.dylib"; print(binaries[0])')
          lipo "$binary" -verify_arch arm64 arm64e
          python3 tests/check_readonly_binary.py "$binary"
          nm -m "$binary" > "$RUNNER_TEMP/mail-readonly-symbols.txt"
          command -v rg
          test -s "$RUNNER_TEMP/mail-readonly-symbols.txt"
          set +e
          rg 'MR5|MRD|MRState|MRTheme|MRNative|MRRule|MRTrace' "$RUNNER_TEMP/mail-readonly-symbols.txt"
          scan_status=$?
          set -e
          test "$scan_status" -eq 1
          echo 'PASS: nm symbol scan executed; legacy rule/theme symbols absent'
          lipo -info "$binary"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          shasum -a 256 packages/*.deb > packages/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mail-rules-0.5.2-${{ github.sha }}
          path: |
            mail-rules/packages/*.deb
            mail-rules/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-rules-log-${{ github.run_id }}
          path: ${{ runner.temp }}/mail-rules-build.log
          if-no-files-found: ignore
          retention-days: 7
