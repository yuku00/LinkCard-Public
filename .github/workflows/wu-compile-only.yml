name: WU iPhoneOS compile only
on:
  push:
    branches: ['wu-compile-only/**']
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: wechat-unified
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build iPhoneOS arm64 dylib only
        run: bash tools/compile_only.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wu-compile-only-${{ github.sha }}
          path: |
            wechat-unified/build/compile-only/WeChatUnified.dylib
            wechat-unified/build/compile-only/SHA256SUMS
            wechat-unified/build/compile-only/platform.txt
            wechat-unified/build/compile-only/architecture.txt
            wechat-unified/build/compile-only/signature.txt
            wechat-unified/build/compile-only/dependencies.txt
            wechat-unified/Vendor/silk/LICENSE
            wechat-unified/Vendor/amr/LICENSE
            wechat-unified/Vendor/amr/NOTICE
            wechat-unified/Vendor/WeChatDragDropImages-LICENSE
          if-no-files-found: error
          retention-days: 30
