name: WeChat Unified dylib
on:
  push:
    branches: ['wechat-unified/**']
    paths:
      - 'wechat-unified/**'
      - '.github/workflows/wechat-unified.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wechat-unified-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone arm64 iOS dylib
        working-directory: wechat-unified
        run: bash tools/build.sh
      - name: Execute four real UIKit surface tests
        run: |
          RESULT="$RUNNER_TEMP/wu-surface-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WU_HARNESS_KEEP_BOOTED=1 python3 wechat-unified/tools/ui-harness/run.py "$GITHUB_WORKSPACE/wechat-unified" "$RESULT"
          cp "$RESULT/verified-tests.json" wechat-unified/build/uikit-verified-tests.json
          cp "$RESULT/destination.json" wechat-unified/build/uikit-destination.json
          cp "$RESULT/xcodebuild.log" wechat-unified/build/uikit-test.log
      - name: Execute eight real UIKit article tests
        run: |
          RESULT="$RUNNER_TEMP/wu-article-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 wechat-unified/tools/test_article_image_ios.py "$RESULT"
          cp "$RESULT/verified-tests.json" wechat-unified/build/article-uikit-verified-tests.json
          cp "$RESULT/destination.json" wechat-unified/build/article-uikit-destination.json
          cp "$RESULT/xcodebuild.log" wechat-unified/build/article-uikit-test.log
      - name: Clean up only our simulator boot
        if: always()
        run: python3 wechat-unified/tools/ui-harness/run.py --cleanup "$RUNNER_TEMP/wu-surface-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload build product and verification
        uses: actions/upload-artifact@v4
        with:
          name: WeChatUnified-arm64-iOS16.6-${{ github.sha }}
          path: wechat-unified/build/
          if-no-files-found: error
          retention-days: 30
