name: WebClipManager build23 device-only experimental delete (manual)
on:
  workflow_dispatch:
    inputs:
      sign_for_trollstore:
        description: 'Install reviewed Homebrew ldid and create a fakesigned IPA (not device-verified)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Check source safety and synthetic Notes format
        run: |
          python3 -m venv /tmp/webclip-checks
          /tmp/webclip-checks/bin/pip install PyYAML==6.0.2
          /tmp/webclip-checks/bin/python Tools/static_check.py
          /tmp/webclip-checks/bin/python Tools/test_entitlement_der.py
          /tmp/webclip-checks/bin/python Tools/test_notes_format.py
          /tmp/webclip-checks/bin/python Tools/test_webclips_access.py
          /tmp/webclip-checks/bin/python Tools/test_build12_policy.py
          python3 Tools/test_helper_spawn_failure.py
          python3 Tools/test_helper_transport.py
          python3 Tools/test_recycle_copy.py
          python3 Tools/test_recycle_operations.py
          python3 Tools/test_delete_path.py
          clang -fobjc-arc -framework Foundation Tools/test_experimental_delete.m Sources/ExperimentalDelete.m Sources/DeletePath.c -o /tmp/wcm-delete-test
          /tmp/wcm-delete-test
          swiftc Sources/ExperimentalDelete.swift Tools/test_experimental_coordinator.swift -o /tmp/wcm-coordinator-test
          /tmp/wcm-coordinator-test
          clang -fobjc-arc -framework Foundation Tools/foundation_path_probe.m -o /tmp/wcm-foundation-path-probe
          /tmp/wcm-foundation-path-probe
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project WebClipManager.xcodeproj -scheme WebClipManager -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/WebClipManager.app package/Payload/
          cp Config/TrollStore.entitlements package/
          cd package && zip -qry ../WebClipManager-unsigned.zip Payload TrollStore.entitlements
      - name: Optional explicit entitlement signing
        if: ${{ inputs.sign_for_trollstore }}
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          brew info --json=v2 ldid > ldid-provenance.json
          BIN=package/Payload/WebClipManager.app/WebClipManager
          test -f "$BIN"
          ldid -SConfig/TrollStore.entitlements "$BIN"
          ldid -e "$BIN" > signed-entitlements.plist
          python3 -c 'import plistlib; expected=plistlib.load(open("Config/TrollStore.entitlements","rb")); actual=plistlib.load(open("signed-entitlements.plist","rb")); assert actual == expected, "Signed entitlements mismatch"; print("Verified signed entitlements:", actual)'
          (cd package && zip -qry ../WebClipManager-TrollStore.ipa Payload)
          shasum -a 256 WebClipManager-TrollStore.ipa > WebClipManager-TrollStore.ipa.sha256
          python3 Tools/verify_ipa.py WebClipManager-TrollStore.ipa > ipa-inspection.json
          otool -l "$BIN" > macho-load-commands.txt
          otool -L "$BIN" > macho-libraries.txt
          xcodebuild -version > toolchain.txt
          xcrun swiftc --version >> toolchain.txt
          xcrun nm -m -u "$BIN" >> toolchain.txt
          xcodebuild -project WebClipManager.xcodeproj -scheme WebClipManager -configuration Release -showBuildSettings | python3 -c 'import sys; print("".join(s for s in sys.stdin if any(k in s for k in ["SWIFT", "DEPLOYMENT_TARGET", "RUNPATH"])))' >> toolchain.txt
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.sign_for_trollstore }}
        with:
          name: WebClipManager-TrollStore-unverified
          path: |
            WebClipManager-TrollStore.ipa
            WebClipManager-TrollStore.ipa.sha256
            signed-entitlements.plist
            ldid-provenance.json
            ipa-inspection.json
            macho-load-commands.txt
            macho-libraries.txt
            toolchain.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: WebClipManager-unsigned-not-installable
          path: WebClipManager-unsigned.zip
          retention-days: 7
